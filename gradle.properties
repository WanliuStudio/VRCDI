# 这台构建机内存较小（2GB 级别），1536m 的堆会让 Gradle daemon 起不来或中途崩掉，
# 表现为 "Could not dispatch a message to the daemon"。
# 降到 768m 并使用 no-daemon 构建；如果换了内存更大的机器，可以把这两行改回去。
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false

# Shizuku 12.1.0 的 AAR 传递依赖了 androidx.annotation（POM 里是 runtime scope），
# AGP 4.2 一旦在依赖图里看到 AndroidX 就要求打开这个开关，否则构建报
# "This project uses AndroidX dependencies, but the 'android.useAndroidX' property is not enabled."
# 打开它只影响依赖处理，不会往 APK 里塞 AppCompat：本工程界面仍用 android.app.Activity。
android.useAndroidX=true
# 工程里没有任何 support library，不需要 jetifier
android.enableJetifier=false
