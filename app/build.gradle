apply plugin: 'com.android.application'

// 和风天气兜底凭据的来源。
// 写在 local.properties 里（该文件已被 .gitignore 排除，永远不会进仓库、进 PR），
// 有值就编译进 APK，装的人不用填任何东西；没有就回落到设置页手输。
// 这样「别人装上就能用」和「仓库里没有 Key」可以同时成立。
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}

// 签名配置：keystore.properties 不入库，内容形如
//   storeFile=vrcdi-release.jks
//   storePassword=...
//   keyAlias=vrcdi
//   keyPassword=...
// 4.4.x 正式版之后，Beta 与正式版统一用发布私钥签名（便于 ADV 验证）。
// 没有 keystore.properties 时 debug 回落到 Android 默认 debug 签名。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream -> keystoreProperties.load(stream) }
}
def signedWithReleaseKey = keystorePropertiesFile.exists()

android {
    // Android Studio 4.2 自带 SDK 30，这里不用更高的 compileSdk，避免 IDE 提示升级
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.vrcdevicecheck.osc"
        // VRChat 移动端最低兼容 API 29（Android 10），本应用与之对齐
        minSdkVersion 29
        targetSdkVersion 30
        versionCode 432
        versionName "5.1.1 Beta2.1"

        // 空字符串表示没有内置凭据，运行时回落到设置页
        buildConfigField "String", "QWEATHER_HOST", "\"${localProperties.getProperty('qweather.host', '')}\""
        buildConfigField "String", "QWEATHER_KEY", "\"${localProperties.getProperty('qweather.key', '')}\""

        // 本次构建是否用发布私钥签名；更新器据此判断是否需要卸载重装
        buildConfigField "boolean", "RELEASE_SIGNED", signedWithReleaseKey ? "true" : "false"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            // 从 4.4.x 正式版起，Beta 也用发布私钥签名（需要 keystore.properties）
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 源码里有中文字符串，必须显式指定 UTF-8，否则 Windows 下会编译出乱码
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    // Shizuku：以 shell(uid 2000) 身份读取受 SELinux 限制的 sysfs / procfs 节点。
    //
    // 版本阶梯（若 Sync 或编译失败，按顺序试）：
    //   1) 12.1.0  —— 当前使用，与 compileSdk 30 时代接近，字节码最保守
    //   2) 11.6.0  —— 更老更稳，但社区反馈 v11.x 及更早在 Android 14 上有 Binder 兼容问题
    //   3) 13.1.5  —— 最新，功能与兼容性最好，但可能需要更高 compileSdk 与 AGP 7+，
    //                 Android Studio 4.2 带不动时不要强上
    //
    // 如果 Shizuku 依赖始终无法在本机编译通过：本工程的 Root 通道不依赖 Shizuku，
    // 只需删掉下面两行依赖、删掉 AndroidManifest 里的 ShizukuProvider 声明、
    // 删掉 priv/ShizukuShell.java，并把 PrivilegeController 里的 SHIZUKU 分支指向 LocalShell，
    // 其余代码不受影响。
    implementation 'dev.rikka.shizuku:api:12.1.0'
    implementation 'dev.rikka.shizuku:provider:12.1.0'

    testImplementation 'junit:junit:4.13.2'
}
